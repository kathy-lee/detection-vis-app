version: '3'

services:
  detection_vis_ui:
    build: 
      dockerfile: detection_vis_ui/Dockerfile
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    ports:
      - 8501:8501
    depends_on:
      - detection_vis_backend
    volumes:
        - ./storage:/storage
  
  detection_vis_backend:
    build:
      dockerfile: detection_vis_backend/Dockerfile
    environment:
      - PYTHONPATH=/opt
      - DB_HOST=0.0.0.0
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PSWD=postgres
      - DB_NAME=postgres
      - REDIS_URL=redis://redis:6379/0
    ports:
      - 8001:8001
    volumes:
      - ./storage:/storage
      # - /home/kangle/.ssh/id_rsa_mifcom:/opt/id_rsa # for ssh mode testing
      # - /home/kangle/projects/indoor_human_rcs.cfg:/opt/indoor_human_rcs.cfg # for testing
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: "redis:7-alpine"
    # Persist the RQ queue / registries / job history so they survive a redis
    # container recreation or host reboot. --appendonly yes enables AOF (redis
    # journals every write to /data and replays it on restart); the named volume
    # gives /data a durable home outside the container's throwaway layer.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Runs training/retraining jobs off the request path. In dev the worker runs on the
  # host (see run.sh) so it gets the GPU. NOTE: GPU passthrough for this container
  # (deploy.resources.reservations.devices / NVIDIA runtime) plus MODEL_ROOTDIR/
  # DATASET_ROOTDIR/TMP_ROOTDIR are a documented prod follow-up — not wired here.
  detection_vis_worker:
    build:
      dockerfile: detection_vis_backend/Dockerfile
    command: python -m detection_vis_backend.jobs.worker
    environment:
      - PYTHONPATH=/opt
      - DB_HOST=0.0.0.0
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PSWD=postgres
      - DB_NAME=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db/postgres
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./storage:/storage
    depends_on:
      - redis
      - db

  db:
    image: "postgres:14"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # - /home/kangle/data/detection-pg-data:/var/lib/postgresql/data  # old bind mount (kept for rollback)
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  pg-data:
